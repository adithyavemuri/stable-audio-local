[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "stable-audio-local"
version = "0.1.0"
description = "Independent Windows setup, launch and raw-audio benchmark tools for Stable Audio 3 Medium"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Adi"}]
dependencies = []

[project.scripts]
stable-audio-local = "stable_audio_local.cli:main"

[project.urls]
Repository = "https://github.com/adithyavemuri/stable-audio-local"
Issues = "https://github.com/adithyavemuri/stable-audio-local/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/stable_audio_local"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/pyproject.toml", "/launch.ps1"]
